<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedstock Process Dashboard BIARAI v65</title>
<style>body{font-family:system-ui,sans-serif;padding:40px;color:#1A3A46;background:#F6FAFC}.load{max-width:760px;margin:auto}</style>
</head>
<body>
<div class="load"><strong>Cargando Feedstock Process Dashboard…</strong></div>
<script>
(async()=>{
  try{
    const [baseRes,cssRes,stageRes]=await Promise.all([
      fetch('./assets/dashboard-base.html',{cache:'no-store'}),
      fetch('./assets/hefa08.css',{cache:'no-store'}),
      fetch('./assets/hefa08.html',{cache:'no-store'})
    ]);
    if(!baseRes.ok||!cssRes.ok||!stageRes.ok) throw new Error('No fue posible cargar uno de los archivos del dashboard.');
    let html=await baseRes.text();
    const css=await cssRes.text();
    const stage=await stageRes.text();
    html=html.replace('Feedstock Process Dashboard BIARAI v13 — Proceso y variables técnicas','Feedstock Process Dashboard BIARAI v65 — Matriz comparativa');
    html=html.replace('</style>',css+'\n</style>');
    const closing='\n</div>\n</div>\n</body>';
    if(!html.includes(closing)) throw new Error('No se encontró el punto de inserción del bloque Ecofining.');
    html=html.replace(closing,'\n'+stage+'\n<script src="./assets/dashboard-core.js?v=65"><\/script>\n<script src="./assets/dashboard-content.js?v=73"><\/script>\n<script src="./assets/dashboard-priorities.js?v=65"><\/script>\n<script src="./assets/matrix-sync-v55.js?v=65"><\/script>\n\n</div>\n</div>\n</body>');

    const controlIaButton=`<a href="./control-ia/" title="Abrir inventario y control del proyecto" style="position:fixed;right:20px;top:18px;z-index:99999;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;background:#263f64;color:#fff;text-decoration:none;font:700 13px/1 system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 5px 16px rgba(25,46,73,.20);border:1px solid rgba(255,255,255,.25)">🧭 Control IA</a>`;
    html=html.replace('</body>',controlIaButton+'\n</body>');

    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<div class="load"><h1>Error al cargar el dashboard</h1><p>'+String(err.message||err)+'</p></div>'}
})();
</script>
</body>
</html>
